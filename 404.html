<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden | Eigenhand</title>
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><meta name="theme-color" content="#123D2F"><link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4EF;--ink:#14211C;--muted:#3E4C46;--green:#1D5B46;--green-d:#123D2F;--mint:#9FE0C3}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.box{max-width:460px}
svg.logo{width:56px;height:56px;margin-bottom:22px}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
p{color:var(--muted);font-size:18px;margin:0 0 26px}
.btn{display:inline-block;background:var(--green);color:#fff;border-radius:11px;padding:15px 24px;font-weight:700;font-size:16px;text-decoration:none}
.btn:hover{background:var(--green-d)}
</style>
</head>
<body>
  <div class="box">
    <img src="img/logo.png" alt="Eigenhand" style="height:56px;width:auto;display:block">
    <h1>Seite nicht gefunden</h1>
    <p>Diese Seite gibt es nicht oder sie wurde verschoben. Kehren Sie zurück zur Startseite.</p>
    <a class="btn" href="/">Zur Startseite</a>
  </div>
</body>
</html>
